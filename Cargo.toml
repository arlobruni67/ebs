[workspace]
resolver = "2"
members = ["crates/engine", "crates/bench", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Media_Multimedia", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Devices_Display", "Win32_System_Performance", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging", "Win32_Media", "Win32_Media_Audio",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_ProcessStatus", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
  "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Foundation",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
panic = "unwind"
